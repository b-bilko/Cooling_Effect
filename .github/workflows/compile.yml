name: Compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      # Arduino requires the sketch folder to match the .ino name.
      - uses: actions/checkout@v4
        with:
          path: Cooling_Effect

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12
          libraries: |
            - name: FastLED
              version: 3.10.5
          sketch-paths: |
            - Cooling_Effect
          enable-warnings-report: true
